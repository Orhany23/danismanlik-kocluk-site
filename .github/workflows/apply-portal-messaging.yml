# Orhany23/danismanlik-kocluk-site için hazırlandı.
# Öğrenci mesajlaşması; çalışma teslimlerinden bağımsızdır.
# GitHub > Actions > Apply Portal Messaging > Run workflow
# Kod doğrulamaları geçmeden master dalına gönderim yapılmaz.
name: Apply Portal Messaging

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-portal-messaging
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check source versions and apply messaging
        shell: python
        run: |
          from pathlib import Path
          import base64,hashlib,json,zlib
          records=json.loads(zlib.decompress(base64.b64decode("")))
          conflicts=[]
          for record in records:
              path=Path(record["path"])
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit("Unsafe path")
              current=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if current not in (record["before"],record["after"]):
                  conflicts.append(record["path"])
          if conflicts:
              raise SystemExit("Dosyalar son incelemeden sonra değişmiş. Hiçbir dosya değiştirilmedi: " + ", ".join(conflicts))
          for record in records:
              data=base64.b64decode(record["content"])
              if hashlib.sha256(data).hexdigest()!=record["after"]:
                  raise SystemExit("Paket doğrulaması başarısız")
          for record in records:
              path=Path(record["path"])
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(record["content"]))
          print(f"{len(records)} dosya uygulandı.")

      - name: Install and generate Prisma client
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src docs/portal-messaging.md tests/portal-messages.test.mjs
          if git diff --cached --quiet; then
            echo "Mesajlaşma zaten uygulanmış."
            exit 0
          fi
          git commit -m "feat: add independent student and advisor messaging"
          git push origin HEAD:master
