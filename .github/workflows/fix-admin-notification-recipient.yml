# Bildirim alıcı adresini yönetici panelinden kaydetmeyi sağlar.
# E-posta adresi kaynak koduna eklenmez; özel ayar olarak veritabanında saklanır.
name: Fix Admin Notification Recipient

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-admin-notification-recipient
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check source versions and apply recipient fix
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json, zlib
          records = json.loads(zlib.decompress(base64.b64decode('')))
          conflicts = []
          for record in records:
              path = Path(record["path"])
              if path.is_absolute() or ".." in path.parts or path.is_symlink():
                  raise SystemExit("Unsafe path")
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if current not in (record["before"], record["after"]):
                  conflicts.append(record["path"])
          if conflicts:
              raise SystemExit("Paketin beklediği dosya sürümü eşleşmiyor. Hiçbir dosya değiştirilmedi: " + ", ".join(conflicts))
          for record in records:
              if hashlib.sha256(base64.b64decode(record["content"])).hexdigest() != record["after"]:
                  raise SystemExit("Paket doğrulaması başarısız")
          for record in records:
              path = Path(record["path"])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(record["content"]))
          print(f"{len(records)} dosya uygulandı. Vercel veya Resend ayarı değiştirilmedi.")

      - name: Install dependencies
        run: npm ci

      - name: Notification recipient regression checks
        run: node --test --test-name-pattern='recipient fix:' tests/portal-notifications.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed code
        run: npx eslint src/lib/portalNotificationSettings.ts src/lib/portalMessageNotifications.ts src/app/api/admin/notification-email/route.ts src/components/messages/AdminNotificationSettings.tsx src/components/messages/AdminMessagesHome.tsx tests/portal-notifications.test.mjs

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portal-notifications.md src/components/messages/AdminMessagesHome.tsx src/lib/portalMessageNotifications.ts tests/portal-notifications.test.mjs src/lib/portalNotificationSettings.ts src/app/api/admin/notification-email/route.ts src/components/messages/AdminNotificationSettings.tsx
          if git diff --cached --quiet; then
            echo "Yönetici bildirim adresi düzeltmesi zaten uygulanmış."
            exit 0
          fi
          git commit -m "fix: configure private admin notification recipient in the portal"
          git push origin HEAD:master
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Yönetici bildirim adresi panelden ayarlanabilir
          Yayın tamamlandıktan sonra Admin > Mesajlar bölümünü açın.
          Bildirim alacağım e-posta alanına adresinizi yazıp Adresi kaydet düğmesine basın.
          Yeni adres sonraki öğrenci/danışan mesajlarında kullanılacak.
          Vercel veya Resend ayarlarını değiştirmeniz gerekmez.
          SUMMARY
