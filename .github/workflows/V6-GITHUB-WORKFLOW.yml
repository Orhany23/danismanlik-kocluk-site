name: Apply V6 Consolidation Quality

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Consolidate and polish
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/app/admin/(panel)/page.tsx")
          s = p.read_text(encoding="utf-8")
          s = s.replace("ArrowUpRight, Clock3, CircleAlert, Sparkles, CheckCircle2, Zap,", "ArrowUpRight, Clock3, Sparkles, CheckCircle2, Zap,")
          s = s.replace(
              "return items.sort((a,b)=>a.priority-b.priority).slice(0,12);",
              'return items.sort((a,b) => a.priority - b.priority || a.title.localeCompare(b.title, "tr")).slice(0,12);'
          )
          p.write_text(s, encoding="utf-8")

          p = Path("src/app/premium-v2.css")
          s = p.read_text(encoding="utf-8")
          marker = "/* AURA V6 / Consolidation & Quality */"
          if marker not in s:
              s += """
          /* AURA V6 / Consolidation & Quality */
          :where(.action-row,.radar-card,.intel-card,.student-os-panel){
            content-visibility:auto;
            contain-intrinsic-size:auto 180px;
          }
          :where(.action-row,.radar-card,.intel-card,.student-os-panel,.advisor-stat){
            -webkit-tap-highlight-color:transparent;
          }
          :where(.action-row,.advisor-stat,.radar-actions a,.radar-actions button,.intel-links a):focus-visible{
            outline:3px solid color-mix(in srgb,var(--clr-primary) 45%,white);
            outline-offset:3px;
          }
          .action-row,.advisor-stat,.radar-card,.intel-card{transform:translateZ(0)}
          @media (prefers-reduced-motion: reduce){
            .action-row,.advisor-stat,.radar-card,.intel-card,.student-os-actions>a{
              transform:none!important;
              transition:none!important;
            }
          }
          @media(max-width:700px){
            .action-list{padding-inline:6px}
            .action-row{touch-action:manipulation}
            .radar-card{padding:15px}
            .radar-actions a,.radar-actions button,.intel-links a{min-height:40px}
          }
          """
          p.write_text(s, encoding="utf-8")

      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/admin/(panel)/page.tsx" src/app/premium-v2.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: consolidate Advisor OS V6 quality layer"
          git push origin HEAD:master
