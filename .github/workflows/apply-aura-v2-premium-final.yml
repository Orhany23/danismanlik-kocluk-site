name: Apply Aura V2 premium design final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply premium visual system
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "src/app/premium-v2.css")"
          echo "" | base64 -d > "src/app/premium-v2.css"
          mkdir -p "$(dirname "src/components/AmbientPointer.tsx")"
          echo "" | base64 -d > "src/components/AmbientPointer.tsx"
          mkdir -p "$(dirname "src/app/layout.tsx")"
          echo "" | base64 -d > "src/app/layout.tsx"

      - name: Fix existing StudentWorkForm lint issue
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/StudentWorkForm.tsx")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'  useEffect\(\(\) => \{\s*'
              r'load\(\);\s*'
              r'\}, \[load\]\);',
              re.MULTILINE,
          )

          replacement = """  useEffect(() => {
            let cancelled = false;

            void fetch("/api/student/work", { cache: "no-store" })
              .then((r) => r.json())
              .then((data: { works?: Work[] }) => {
                if (!cancelled) setWorks(data.works ?? []);
              })
              .catch(() => {
                if (!cancelled) setWorks([]);
              });

            return () => {
              cancelled = true;
            };
          }, []);"""

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"StudentWorkForm effect replacement count was {count}; aborting safely.")

          path.write_text(text, encoding="utf-8")

      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/premium-v2.css src/components/AmbientPointer.tsx src/app/layout.tsx src/components/StudentWorkForm.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: introduce Aura V2 premium visual system and fix student work lint"
          git push origin HEAD:master
