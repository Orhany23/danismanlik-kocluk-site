name: Apply Student Radar V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Student Radar
        shell: bash
        run: |
          set -euo pipefail
          echo "" | base64 -d > "src/app/api/admin/students/route.ts"
          echo "" | base64 -d > "src/app/admin/(panel)/students/page.tsx"
          echo "" | base64 -d >> "src/app/premium-v2.css"
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/api/admin/students/route.ts" "src/app/admin/(panel)/students/page.tsx" src/app/premium-v2.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add proactive Student Radar to Advisor OS"
          git push origin HEAD:master
