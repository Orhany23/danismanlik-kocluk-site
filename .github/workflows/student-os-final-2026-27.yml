name: Student OS FINAL 2026-27
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  final-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply FINAL Student OS upgrade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'src/lib/curriculum.ts')"
          echo '' | base64 -d > 'src/lib/curriculum.ts'
          mkdir -p "$(dirname 'src/components/MufredatClient.tsx')"
          echo '' | base64 -d > 'src/components/MufredatClient.tsx'
          mkdir -p "$(dirname 'src/app/api/student/profile/route.ts')"
          echo '' | base64 -d > 'src/app/api/student/profile/route.ts'
          mkdir -p "$(dirname 'src/components/StudentProfileSettings.tsx')"
          echo '' | base64 -d > 'src/components/StudentProfileSettings.tsx'
          mkdir -p "$(dirname 'src/lib/shareImage.ts')"
          echo '' | base64 -d > 'src/lib/shareImage.ts'
          mkdir -p "$(dirname 'src/components/ShareAsImageButton.tsx')"
          echo '' | base64 -d > 'src/components/ShareAsImageButton.tsx'
          python3 <<'PY'
          from pathlib import Path
          p=Path("src/app/ogrenci/page.tsx");s=p.read_text()
          if 'from "@/lib/curriculum"' not in s:s=s.replace('import { ensureResourceSchema } from "@/lib/ensureResourceSchema";','import { ensureResourceSchema } from "@/lib/ensureResourceSchema";\nimport { getGradeById, guessGradeId } from "@/lib/curriculum";')
          if 'StudentProfileSettings' not in s:s=s.replace('import StudentPasswordChange from "@/components/StudentPasswordChange";','import StudentPasswordChange from "@/components/StudentPasswordChange";\nimport StudentProfileSettings from "@/components/StudentProfileSettings";')
          s=s.replace('async function getProgress(studentId:string){try{const[total,checked,works,pending]=await Promise.all([prisma.topicProgress.count({where:{studentId}}),prisma.topicProgress.count({where:{studentId,checkedAt:{not:null}}}),prisma.studentWork.count({where:{studentId}}),prisma.studentWork.count({where:{studentId,seen:false}})]);return{total,checked,works,pending}}catch{return{total:0,checked:0,works:0,pending:0}}','async function getProgress(studentId:string,gradeId:string){try{const grade=getGradeById(gradeId);const topicIds=grade?.subjects.flatMap(s=>s.topics.map(t=>t.id))??[];const[checked,works,pending]=await Promise.all([topicIds.length?prisma.topicProgress.count({where:{studentId,topicId:{in:topicIds},checkedAt:{not:null}}}):Promise.resolve(0),prisma.studentWork.count({where:{studentId}}),prisma.studentWork.count({where:{studentId,seen:false}})]);return{total:topicIds.length,checked,works,pending}}catch{return{total:0,checked:0,works:0,pending:0}}')
          s=s.replace(' const[nextMeeting,latestFeedback,progress,personal,library]=await Promise.all([\n  getNextMeeting(student.clientId),getLatestFeedback(student.id),getProgress(student.id),',' const gradeId=guessGradeId(student.gradeLevel);\n const[nextMeeting,latestFeedback,progress,personal,library]=await Promise.all([\n  getNextMeeting(student.clientId),getLatestFeedback(student.id),getProgress(student.id,gradeId),')
          s=s.replace('<div className="student-os-secondary"><StudentTestimonial/><StudentPasswordChange/></div>','<div className="student-os-secondary"><StudentTestimonial/><StudentProfileSettings name={student.name} email={student.email} gradeLevel={student.gradeLevel}/><StudentPasswordChange/></div>')
          p.write_text(s)
          
          p=Path("src/components/TodayHighlights.tsx");s=p.read_text()
          s=s.replace('kicker={t.daily.badge}\n        quote={daily.t}\n        attribution={`${daily.r} · ${daily.y}`}','kicker={t.daily.badge}\n        title={daily.t}\n        body={daily.s}\n        attribution={`${daily.r} · ${daily.y}`}\n        cta="Araştırmanın tamamı →"')
          s=s.replace('kicker={t.kinds[spark.k]}\n        quote={spark.k === "motivasyon" ? spark.t : `${spark.t}${spark.c ? " — " + spark.c : ""}`}','kicker={t.kinds[spark.k]}\n        title={spark.k === "motivasyon" ? undefined : spark.t}\n        quote={spark.k === "motivasyon" ? spark.t : undefined}\n        body={spark.k === "motivasyon" ? undefined : spark.c}\n        cta="Her gün yeni içerik →"')
          p.write_text(s)
          
          css=Path("src/app/premium-v2.css");c=css.read_text();marker="/* AURA V7 FINAL / Curriculum Analytics + Profile */"
          if marker not in c:c+='''\n\n/* AURA V7 FINAL / Curriculum Analytics + Profile */\n.student-profile-settings{padding:clamp(20px,4vw,30px);border:1px solid #e0e6e3;background:rgba(255,255,255,.78)}.student-profile-settings .student-section-head>div>p{margin-top:4px;color:#7c8989;font-size:.7rem}.student-profile-settings .student-section-head>svg{width:22px;color:#14736f}.student-profile-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;max-width:760px}.student-profile-form label:last-of-type{grid-column:1/-1}.student-profile-form .auth-btn{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:7px;max-width:260px}.profile-msg{grid-column:1/-1;margin:0;font-size:.72rem}.profile-msg.ok{color:#3b846b}.profile-msg.error{color:#b33b31}\n.mufredat-analytics{margin:0 0 28px;padding:22px;border:1px solid rgba(15,102,102,.12);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(238,247,244,.84));box-shadow:0 25px 60px -50px rgba(7,43,46,.7)}.mufredat-overall{display:flex;align-items:center;justify-content:space-between;gap:20px}.mufredat-overall span{display:block;color:#137571;font-size:.64rem;font-weight:800;letter-spacing:.12em}.mufredat-overall strong{display:block;margin:5px 0;font-size:clamp(2.2rem,5vw,3.6rem);letter-spacing:-.06em;color:#203638}.mufredat-overall small{color:#748284}.mufredat-ring{--progress:0deg;width:104px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#14736f var(--progress),#e2ebe8 0);position:relative;flex:none}.mufredat-ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}.mufredat-ring b{position:relative;z-index:1;color:#173b3b}.mufredat-course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}.mufredat-course-progress{padding:12px;border:1px solid #e3e9e7;border-radius:14px;background:rgba(255,255,255,.72)}.mufredat-course-progress>div{display:flex;justify-content:space-between;gap:10px;font-size:.7rem}.mufredat-course-progress span{color:#778585}.mufredat-course-progress>i,.mufredat-subject-bar{display:block;height:5px;margin-top:8px;border-radius:999px;background:#e7ecea;overflow:hidden}.mufredat-course-progress em,.mufredat-subject-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#54c4ba,#e0b66d)}.mufredat-source{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:#14736f;font-size:.7rem;font-weight:700}.mufredat-subject-percent{margin-left:auto;color:#14736f;font-weight:800;font-size:.78rem}.mufredat-subject-bar{margin:0;height:4px;border-radius:0}.mufredat-subject-head .mufredat-subject-count{margin-left:0}\n@media(max-width:620px){.student-profile-form,.mufredat-course-grid{grid-template-columns:1fr}.student-profile-form label:last-of-type,.student-profile-form .auth-btn,.profile-msg{grid-column:1}.mufredat-analytics{padding:17px}.mufredat-ring{width:86px}}\n'''
          css.write_text(c)
          PY
      - name: Install and verify
        run: |
          npm ci
          npx prisma generate
          npm run typecheck
          npm run lint
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Commit verified FINAL upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/curriculum.ts src/components/MufredatClient.tsx src/app/api/student/profile/route.ts src/components/StudentProfileSettings.tsx src/app/ogrenci/page.tsx src/lib/shareImage.ts src/components/ShareAsImageButton.tsx src/components/TodayHighlights.tsx src/app/premium-v2.css
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "feat: Student OS final curriculum progress profile and social sharing"
          git push origin HEAD:master
