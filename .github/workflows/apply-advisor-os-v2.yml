name: Apply Advisor OS V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply advisor operating dashboard
        shell: bash
        run: |
          set -euo pipefail
          echo "" | base64 -d > "src/app/admin/(panel)/page.tsx"
          cat >> "src/app/premium-v2.css" <<'AURA_ADVISOR_OS'

/* AURA V2 / Advisor OS — operational cockpit */
.advisor-os { max-width: 1500px; margin-inline: auto; }
.advisor-hero {
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: clamp(24px,4vw,42px); border-radius: 30px; color: #eef9f6;
  background:
    radial-gradient(600px 260px at 90% 0%, rgba(89,201,190,.20), transparent 68%),
    radial-gradient(460px 260px at 15% 100%, rgba(213,162,83,.13), transparent 70%),
    linear-gradient(135deg,#071719,#0b3032);
  box-shadow: 0 32px 80px -48px rgba(3,32,34,.8);
}
.advisor-hero::after { content:""; position:absolute; width:260px; height:260px; border:1px solid rgba(255,255,255,.08); border-radius:50%; right:-90px; top:-130px; box-shadow:0 0 0 45px rgba(255,255,255,.025),0 0 0 90px rgba(255,255,255,.018); }
.advisor-kicker { display:inline-flex; align-items:center; gap:7px; color:#82d5ce; font-size:.68rem; font-weight:800; letter-spacing:.14em; }
.advisor-hero h2 { margin-top:12px; font-family:var(--font-display); font-size:clamp(2rem,4vw,3.6rem); line-height:.98; letter-spacing:-.035em; }
.advisor-hero p { margin-top:12px; color:#a9c0bc; max-width:55ch; }
.advisor-focus { position:relative; z-index:1; min-width:min(100%,330px); display:flex; align-items:center; gap:13px; padding:16px 18px; border:1px solid rgba(255,255,255,.1); border-radius:18px; background:rgba(255,255,255,.065); backdrop-filter:blur(15px); }
.advisor-focus > svg { color:#e0b66d; flex:none; }
.advisor-focus.is-clear > svg { color:#78d1b2; }
.advisor-focus div { display:grid; gap:3px; }
.advisor-focus strong { font-size:.92rem; }
.advisor-focus span { color:#9fb6b2; font-size:.75rem; line-height:1.4; }

.advisor-stats { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:12px; }
.advisor-stat { position:relative; min-height:142px; padding:17px; display:flex; flex-direction:column; border:1px solid #e4e9e7; border-radius:21px; background:rgba(255,255,255,.82); box-shadow:0 20px 50px -42px rgba(7,43,46,.65); transition:transform .35s var(--aura-ease),box-shadow .35s var(--aura-ease),border-color .35s; }
.advisor-stat:hover { transform:translateY(-5px); border-color:rgba(15,102,102,.25); box-shadow:0 28px 55px -38px rgba(7,43,46,.55); }
.advisor-stat-icon { width:35px; height:35px; display:grid; place-items:center; border-radius:11px; background:#eef6f4; color:#0f6666; }
.advisor-stat-value { margin-top:auto; font-size:1.85rem; font-weight:800; letter-spacing:-.04em; color:#122326; }
.advisor-stat-label { margin-top:1px; color:#6b797b; font-size:.73rem; line-height:1.25; }
.advisor-stat-arrow { position:absolute; right:15px; top:16px; color:#a4afaf; }
.tone-amber .advisor-stat-icon { background:#fff6df; color:#9a6a16; }.tone-rose .advisor-stat-icon{background:#fff0ef;color:#a95250}.tone-indigo .advisor-stat-icon{background:#f0efff;color:#6159a9}.tone-blue .advisor-stat-icon{background:#edf5ff;color:#4076a8}.tone-emerald .advisor-stat-icon{background:#eaf8f1;color:#388466}.tone-violet .advisor-stat-icon{background:#f6efff;color:#7750a5}

.advisor-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr); gap:18px; }
.advisor-panel { border:1px solid #e3e8e6; border-radius:26px; background:rgba(255,255,255,.82); overflow:hidden; box-shadow:0 24px 65px -52px rgba(7,43,46,.55); }
.advisor-panel-head { display:flex; align-items:end; justify-content:space-between; gap:16px; padding:22px 24px 16px; border-bottom:1px solid #edf0ef; }
.advisor-overline { color:#0f7774; font-size:.63rem; font-weight:800; letter-spacing:.13em; }
.advisor-panel-head h3 { margin-top:3px; font-size:1.05rem; color:#152527; }
.advisor-panel-head > a { display:inline-flex; align-items:center; gap:4px; color:#617072; font-size:.72rem; }
.advisor-agenda-list,.advisor-message-list { padding:7px 10px 12px; }
.advisor-agenda-item { position:relative; display:grid; grid-template-columns:155px minmax(0,1fr) auto; align-items:center; gap:16px; min-height:67px; padding:11px 13px; border-radius:15px; transition:background .25s,transform .25s var(--aura-ease); }
.advisor-agenda-item:hover,.advisor-message:hover { background:#f2f7f5; transform:translateX(3px); }
.advisor-time { display:flex; align-items:center; gap:6px; color:#6a7879; font-size:.72rem; }
.advisor-agenda-main { display:grid; min-width:0; }
.advisor-agenda-main strong { color:#203033; font-size:.84rem; }.advisor-agenda-main span{color:#788587;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.advisor-kind { padding:5px 8px; border-radius:999px; background:#edf6f4; color:#176e6c; font-size:.64rem; font-weight:700; }
.advisor-next { position:absolute; left:13px; bottom:2px; color:#b17b2c; font-size:.55rem; font-weight:800; letter-spacing:.08em; }
.advisor-message { display:grid; grid-template-columns:8px minmax(0,1fr) auto; align-items:center; gap:11px; padding:12px 10px; border-radius:14px; transition:background .25s,transform .25s var(--aura-ease); }
.advisor-message-dot { width:6px;height:6px;border-radius:50%;background:#d4dcda }.advisor-message.is-unread .advisor-message-dot{background:#16807c;box-shadow:0 0 0 4px rgba(22,128,124,.1)}
.advisor-message strong { color:#273638;font-size:.78rem }.advisor-message p{margin-top:2px;color:#7b8788;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.advisor-message time{color:#a0aaaa;font-size:.63rem}
.advisor-empty { padding:34px 16px; text-align:center; color:#8a9697; font-size:.78rem; }

.advisor-shortcuts { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:10px; border-radius:18px; background:#e9eeeb; }
.advisor-shortcuts > span { padding:0 10px; color:#697778; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
.advisor-shortcuts a { padding:9px 13px; border:1px solid rgba(15,102,102,.09); border-radius:11px; background:rgba(255,255,255,.78); color:#354648; font-size:.73rem; font-weight:600; transition:transform .25s var(--aura-ease),color .25s; }
.advisor-shortcuts a:hover { transform:translateY(-2px); color:#0f6666; }

@media(max-width:1200px){.advisor-stats{grid-template-columns:repeat(4,1fr)}}
@media(max-width:850px){.advisor-hero{align-items:flex-start;flex-direction:column}.advisor-focus{width:100%}.advisor-grid{grid-template-columns:1fr}.advisor-stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.advisor-hero{border-radius:23px;padding:24px 20px}.advisor-stats{gap:9px}.advisor-stat{min-height:124px;padding:14px;border-radius:17px}.advisor-stat-value{font-size:1.55rem}.advisor-agenda-item{grid-template-columns:1fr auto;gap:7px}.advisor-time{grid-column:1/-1}.advisor-panel-head{padding-inline:17px}.advisor-shortcuts{overflow-x:auto;flex-wrap:nowrap}.advisor-shortcuts>*{flex:none}}

AURA_ADVISOR_OS

      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/admin/(panel)/page.tsx" src/app/premium-v2.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: turn admin dashboard into Advisor OS"
          git push origin HEAD:master
