name: Apply premium site upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply prepared files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          files = {
              'package.json': '',
              'src/lib/rateLimit.ts': '',
              'src/components/HashScrollHandler.tsx': '',
              'src/app/layout.tsx': '',
              'src/app/performance.css': '',
              'src/app/page.tsx': '',
              'src/app/api/auth/forgot-password/route.ts': '',
              'src/app/api/auth/reset-password/route.ts': '',
              '.github/workflows/ci.yml': '',
          }

          for name, encoded in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              print(f"updated: {name}")
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src .github/workflows/ci.yml
          git commit -m "feat: apply premium performance and security upgrade"
          git push origin HEAD:master
