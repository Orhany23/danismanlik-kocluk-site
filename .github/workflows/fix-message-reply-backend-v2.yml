name: Fix Message Reply Backend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply backend fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64

          p=Path("prisma/schema.prisma")
          s=p.read_text(encoding="utf-8")
          if "  reply     String?" not in s:
              anchor="  read      Boolean  @default(false)\n"
              if anchor not in s: raise SystemExit("Message schema anchor not found")
              s=s.replace(anchor,anchor+base64.b64decode("ICByZXBseSAgICAgU3RyaW5nPwogIHJlcGxpZWRBdCBEYXRlVGltZT8K").decode(),1)
              p.write_text(s,encoding="utf-8")

          Path("src/lib/ensureMessageReplySchema.ts").write_text(base64.b64decode("").decode(),encoding="utf-8")

          p=Path("src/lib/email.ts")
          s=p.read_text(encoding="utf-8")
          if "sendContactReplyEmail" not in s:
              marker="function escapeHtml(str: string): string {"
              if marker not in s: raise SystemExit("email anchor not found")
              s=s.replace(marker,base64.b64decode("").decode()+marker,1)
              p.write_text(s,encoding="utf-8")

          Path("src/app/api/messages/route.ts").write_text(base64.b64decode("").decode(),encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/lib/ensureMessageReplySchema.ts src/lib/email.ts src/app/api/messages/route.ts
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "fix: complete message reply backend"
          git push origin HEAD:master
