# Mevcut portal mesajlaşmasına iki yönlü e-posta bildirimi ekler.
# Resend ayarları Vercel ortam değişkenlerinden okunur; buraya API anahtarı yazmayın.
name: Apply Message Email Notifications

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-message-email-notifications
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check source versions and apply notifications
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json, zlib
          records = json.loads(zlib.decompress(base64.b64decode('')))
          conflicts = []
          for record in records:
              path = Path(record["path"])
              if path.is_absolute() or ".." in path.parts or path.is_symlink():
                  raise SystemExit("Unsafe path")
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if current not in (record["before"], record["after"]):
                  conflicts.append(record["path"])
          if conflicts:
              raise SystemExit("Paketin beklediği dosya sürümü eşleşmiyor. Hiçbir dosya değiştirilmedi: " + ", ".join(conflicts))
          for record in records:
              if hashlib.sha256(base64.b64decode(record["content"])).hexdigest() != record["after"]:
                  raise SystemExit("Paket doğrulaması başarısız")
          for record in records:
              path = Path(record["path"])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(record["content"]))
          print(f"{len(records)} dosya uygulandı. Veritabanı değişikliği yok.")

      - name: Install and generate Prisma client
        run: npm ci

      - name: Offline notification tests
        run: node --test tests/portal-notifications.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/portalMessages.ts src/components/messages/AdminMessagesHome.tsx 'src/app/admin/(panel)/messages/page.tsx' src/lib/portalNotificationEmail.ts src/lib/portalMessageNotifications.ts tests/portal-notifications.test.mjs docs/portal-notifications.md
          if git diff --cached --quiet; then
            echo "E-posta bildirimleri zaten uygulanmış."
            exit 0
          fi
          git commit -m "feat: notify students and advisor about new portal messages"
          git push origin HEAD:master
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## E-posta bildirimleri eklendi
          Vercel yayını tamamlandıktan sonra admin panelindeki Mesajlar alanını kontrol edin.
          Gereken ayarlar: RESEND_API_KEY ve doğrulanmış RESEND_FROM_EMAIL.
          Size bildirim gelmesi için PORTAL_ADMIN_NOTIFICATION_EMAIL tanımlanabilir.
          Sistemde tek ADMIN hesabı varsa onun e-posta adresi otomatik kullanılır.
          Ortam değişkenlerini yeni eklediyseniz Vercel'de Redeploy yapın.
          Ayrıntılar: docs/portal-notifications.md
          SUMMARY
